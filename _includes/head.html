<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="YOUR_CODE_HERE" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            primary: '#3B82F6',
            secondary: '#1E40AF',
            accent: '#10B981',
          }
        }
      }
    }
  </script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Comprehensive SEO, Schema, and Meta Tags -->
  {% include seo.html %}

  <script>
    window.FREECLIPBOARD_CONFIG = {
      gtagId: {% if site.gtag_id %}"{{ site.gtag_id }}"{% else %}null{% endif %},
      adsenseClient: "ca-pub-4980642476233510"
    };

    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { dataLayer.push(arguments); };

    window.gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      functionality_storage: 'denied',
      personalization_storage: 'denied',
      wait_for_update: 500
    });
  </script>

  <!-- Favicons and Touch Icons -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <meta name="msapplication-TileImage" content="{{ '/assets/images/mstile-150x150.png' | relative_url }}">

  <!-- Base Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/navigation.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/header-layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tool-pages.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/category-pages.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/complete-fix.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/language-switcher.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/search.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cookie-consent.css' | relative_url }}">

  <!-- Global Design System - Load Last for Highest Priority -->
  <link rel="stylesheet" href="{{ '/assets/css/design-system.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">

  <!-- Preload Critical Resources -->
  <link rel="preload" href="{{ site.baseurl }}/assets/js/main.js" as="script">

  <!-- i18n Engine -->
  <script src="{{ site.baseurl }}/assets/js/i18n.js"></script>

  <!-- Google AdSense - Async -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4980642476233510"
    crossorigin="anonymous"></script>

  <!-- Set light mode as default -->
  <script>
    (function () {
      // Only set light if no saved preference exists
      var saved = localStorage.getItem('theme');
      if (!saved) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>

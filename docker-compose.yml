## ─────────────────────────────────────────────────────────────────────────────
## FreeClipboard: n8n + Ollama Production Stack
## Optimized for HIGH TRAFFIC, fast response, and stability
## ─────────────────────────────────────────────────────────────────────────────

networks:
  n8n-net:
    driver: bridge

services:

  # ─── REDIS (Queue Backend) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 511
      --hz 10
      --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - C:\Docker\redis-data:/data
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── N8N MAIN (Webhook receiver + UI) ────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Core ---
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Karachi
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=1
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=true
      # --- Domain & Protocol ---
      - WEBHOOK_URL=https://n8ninstance.btech.cfd/
      - N8N_HOST=n8ninstance.btech.cfd
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      # --- Features ---
      - N8N_FEATURE_FLAG_MCP=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      # --- Session & Cookies ---
      - N8N_SECURE_COOKIE=false
      - N8N_COOKIES_SAMESITE=lax
      - N8N_SESSION_COOKIE_NAME=n8n-auth
      # --- Queue Mode ---
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD=10000
      # --- Concurrency & Performance ---
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - N8N_PAYLOAD_SIZE_MAX=16
      - DB_SQLITE_VACUUM_ON_STARTUP=true
      # --- Execution Limits & Pruning ---
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # --- Logging ---
      - N8N_LOG_LEVEL=warn
      - N8N_LOG_OUTPUT=console
    volumes:
      - C:\Docker\n8n-data:/home/node/.n8n
    networks:
      - n8n-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── N8N WORKER 1 (Primary execution engine) ─────────────────────
  n8n-worker-1:
    image: n8nio/n8n:latest
    container_name: n8n-worker-1
    restart: unless-stopped
    command: worker
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Karachi
      - N8N_FEATURE_FLAG_MCP=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      # --- Queue ---
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      # --- Concurrency: process up to 10 jobs simultaneously ---
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      # --- Safety ---
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      # --- Logging ---
      - N8N_LOG_LEVEL=warn
    volumes:
      - C:\Docker\n8n-data:/home/node/.n8n
    networks:
      - n8n-net
    depends_on:
      - redis
      - n8n
    mem_limit: 1g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  # ─── N8N WORKER 2 (Secondary worker for high traffic) ────────────
  n8n-worker-2:
    image: n8nio/n8n:latest
    container_name: n8n-worker-2
    restart: unless-stopped
    command: worker
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Karachi
      - N8N_FEATURE_FLAG_MCP=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      # --- Queue ---
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      # --- Concurrency ---
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      # --- Safety ---
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      # --- Logging ---
      - N8N_LOG_LEVEL=warn
    volumes:
      - C:\Docker\n8n-data:/home/node/.n8n
    networks:
      - n8n-net
    depends_on:
      - redis
      - n8n
    mem_limit: 1g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  # ─── OLLAMA (LLM Engine) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=15m
      - OLLAMA_MAX_QUEUE=16
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - C:\Docker\ollama-data:/root/.ollama
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 6g
    cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"
